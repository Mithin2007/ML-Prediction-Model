version: 0.0
os: linux

files:
  - source: /
    destination: /home/ec2-user/ml-deployment

file_exists_behavior: OVERWRITE

hooks:
  ApplicationStop:
    - location: scripts/stop_container.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: scripts/build_container.sh
      timeout: 600
      runas: root

  ApplicationStart:
    - location: scripts/start_container.sh
      timeout: 120
      runas: root
